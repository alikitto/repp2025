# Скопировать в /etc/nginx/sites-available/tutor
# ln -s /etc/nginx/sites-available/tutor /etc/nginx/sites-enabled/
# Подставь server_name, root и версию php-fpm.
# HTTPS: certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# После certbot: подставь пути к сертификатам.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;
    root /var/www/tutor;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    location ~ /\. { deny all; return 404; }
    location ^~ /data/ { deny all; return 404; }
    location ^~ /scripts/ { deny all; return 404; }
    location ^~ /common/ { deny all; return 404; }
    location ^~ /.git/ { deny all; return 404; }
    location = /db_conn.php { deny all; return 404; }
    location ~* \.(sql|env|sh)$ { deny all; return 404; }

    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param HTTPS on;
    }

    location ~* \.(css|js|ico|png|jpg|svg|woff2)$ {
        expires 7d;
        access_log off;
    }
}
