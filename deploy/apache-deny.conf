<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<LocationMatch "^/(data|scripts|common|\.git)(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "^(db_conn\.php|\.env(\..*)?)$">
    Require all denied
</FilesMatch>
<FilesMatch "\.(sql|env|sh)$">
    Require all denied
</FilesMatch>
